# OpenClaw VPS Deployment - Standalone Docker Compose
#
# This file is for deploying OpenClaw on a VPS without cloning the repository.
# It uses pre-built images from GitHub Container Registry.
#
# Quick start:
#   1. Download this file and the .env.vps.example to your VPS
#   2. Copy .env.vps.example to .env and configure your settings
#   3. Run: docker compose -f docker-compose.vps.yml up -d openclaw-gateway
#
# For channel setup (after gateway is running):
#   WhatsApp: docker compose -f docker-compose.vps.yml run --rm openclaw-cli channels login
#   Telegram: docker compose -f docker-compose.vps.yml run --rm openclaw-cli channels add --channel telegram --token <token>
#   Discord:  docker compose -f docker-compose.vps.yml run --rm openclaw-cli channels add --channel discord --token <token>
#
# Custom packages:
#   Option 1: Build custom image (see Dockerfile.vps.custom)
#   Option 2: Set OPENCLAW_INIT_SCRIPT to run commands at startup
#   Option 3: Mount host binaries via OPENCLAW_EXTRA_MOUNTS

# =============================================================================
# SHARED CONFIGURATION (YAML Anchors)
# =============================================================================

x-common-env: &common-env
  # === System ===
  HOME: /home/node
  TERM: xterm-256color
  TZ: ${TZ:-UTC}
  NODE_ENV: ${NODE_ENV:-production}

  # === OpenClaw Core ===
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
  OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
  OPENCLAW_PROFILE: ${OPENCLAW_PROFILE:-default}
  OPENCLAW_STATE_DIR: ${OPENCLAW_STATE_DIR:-}
  OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH:-}
  OPENCLAW_AGENT_DIR: ${OPENCLAW_AGENT_DIR:-}

x-ai-providers: &ai-providers
  # === Anthropic ===
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}

  # === OpenAI ===
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TTS_BASE_URL: ${OPENAI_TTS_BASE_URL:-}

  # === Google ===
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # === Other Providers ===
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  VENICE_API_KEY: ${VENICE_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  KIMICODE_API_KEY: ${KIMICODE_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  CHUTES_API_KEY: ${CHUTES_API_KEY:-}
  CHUTES_OAUTH_TOKEN: ${CHUTES_OAUTH_TOKEN:-}
  QWEN_PORTAL_API_KEY: ${QWEN_PORTAL_API_KEY:-}
  QWEN_OAUTH_TOKEN: ${QWEN_OAUTH_TOKEN:-}

  # === Z.AI (GLM) ===
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  Z_AI_API_KEY: ${Z_AI_API_KEY:-}

  # === Synthetic ===
  SYNTHETIC_API_KEY: ${SYNTHETIC_API_KEY:-}

  # === GitHub Copilot ===
  COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
  GH_TOKEN: ${GH_TOKEN:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-aws-bedrock: &aws-bedrock
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
  AWS_PROFILE: ${AWS_PROFILE:-}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}

x-channel-tokens: &channel-tokens
  # === Telegram ===
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

  # === Discord ===
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

  # === Slack ===
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}

  # === Twilio (WhatsApp) ===
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}

  # === LINE ===
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}

x-tools: &tools
  # === Web Search ===
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}

  # === Text-to-Speech ===
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  XI_API_KEY: ${XI_API_KEY:-}

x-debug: &debug
  OPENCLAW_DEBUG_TELEGRAM_ACCOUNTS: ${OPENCLAW_DEBUG_TELEGRAM_ACCOUNTS:-}
  OPENCLAW_ANTHROPIC_PAYLOAD_LOG: ${OPENCLAW_ANTHROPIC_PAYLOAD_LOG:-}
  OPENCLAW_ANTHROPIC_PAYLOAD_LOG_FILE: ${OPENCLAW_ANTHROPIC_PAYLOAD_LOG_FILE:-}
  OPENCLAW_CACHE_TRACE: ${OPENCLAW_CACHE_TRACE:-}
  OPENCLAW_CACHE_TRACE_FILE: ${OPENCLAW_CACHE_TRACE_FILE:-}
  OPENCLAW_CACHE_TRACE_MESSAGES: ${OPENCLAW_CACHE_TRACE_MESSAGES:-}
  OPENCLAW_CACHE_TRACE_PROMPT: ${OPENCLAW_CACHE_TRACE_PROMPT:-}
  OPENCLAW_CACHE_TRACE_SYSTEM: ${OPENCLAW_CACHE_TRACE_SYSTEM:-}
  OPENCLAW_SKIP_CANVAS_HOST: ${OPENCLAW_SKIP_CANVAS_HOST:-}
  OPENCLAW_BASH_PENDING_MAX_OUTPUT_CHARS: ${OPENCLAW_BASH_PENDING_MAX_OUTPUT_CHARS:-}
  OPENCLAW_EAGER_CHANNEL_OPTIONS: ${OPENCLAW_EAGER_CHANNEL_OPTIONS:-}
  OPENCLAW_CLAUDE_CLI_LOG_OUTPUT: ${OPENCLAW_CLAUDE_CLI_LOG_OUTPUT:-}
  FORCE_COLOR: ${FORCE_COLOR:-}
  NO_COLOR: ${NO_COLOR:-}

x-volumes: &volumes
  - ${OPENCLAW_CONFIG_DIR:-./data/config}:/home/node/.openclaw
  - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace

# =============================================================================
# SERVICES
# =============================================================================

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: openclaw-gateway
    # To run as root (for init script with apt-get), uncomment:
    # user: "0:0"
    environment:
      <<: [*common-env, *ai-providers, *aws-bedrock, *channel-tokens, *tools, *debug]
      # Gateway requires token (not optional)
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Custom PATH prepend for mounted binaries
      PATH: ${OPENCLAW_PATH_PREPEND:-}${OPENCLAW_PATH_PREPEND:+:}/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./data/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace
      # Optional: Mount custom binaries from host
      # Uncomment and configure as needed:
      # - ${OPENCLAW_CUSTOM_BIN:-./bin}:/usr/local/custom-bin:ro
      # - /usr/bin/ffmpeg:/usr/bin/ffmpeg:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    # Default command (no init script)
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}"
      ]

  # Alternative gateway with init script support
  # Usage: docker compose -f docker-compose.vps.yml up -d openclaw-gateway-custom
  openclaw-gateway-custom:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: openclaw-gateway-custom
    # Run as root to allow apt-get in init script
    user: "0:0"
    environment:
      <<: [*common-env, *ai-providers, *aws-bedrock, *channel-tokens, *tools, *debug]
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      PATH: ${OPENCLAW_PATH_PREPEND:-}${OPENCLAW_PATH_PREPEND:+:}/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Packages to install at startup (space-separated)
      OPENCLAW_APT_PACKAGES: ${OPENCLAW_APT_PACKAGES:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./data/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace
      # Mount init script if provided
      - ${OPENCLAW_INIT_SCRIPT:-/dev/null}:/docker-entrypoint-init.sh:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Install apt packages if specified
        if [ -n "$OPENCLAW_APT_PACKAGES" ]; then
          echo "Installing packages: $OPENCLAW_APT_PACKAGES"
          apt-get update && apt-get install -y --no-install-recommends $OPENCLAW_APT_PACKAGES
          rm -rf /var/lib/apt/lists/*
        fi
        # Run custom init script if provided and executable
        if [ -f /docker-entrypoint-init.sh ] && [ -s /docker-entrypoint-init.sh ]; then
          echo "Running init script..."
          sh /docker-entrypoint-init.sh
        fi
        # Start gateway
        exec node dist/index.js gateway --bind "${OPENCLAW_GATEWAY_BIND:-lan}" --port "${OPENCLAW_GATEWAY_PORT:-18789}"
    profiles:
      - custom

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: openclaw-cli
    environment:
      <<: [*common-env, *ai-providers, *aws-bedrock, *channel-tokens]
      BROWSER: echo
    volumes: *volumes
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    profiles:
      - cli
