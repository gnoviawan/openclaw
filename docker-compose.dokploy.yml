# OpenClaw Dokploy Deployment
#
# This Docker Compose file is optimized for Dokploy deployment.
# It uses pre-built images from GitHub Container Registry.
#
# Deployment Options:
#   1. RECOMMENDED: Use Dokploy's native domain management (Domains tab in UI)
#   2. MANUAL: Configure Traefik labels directly in this file
#
# Setup in Dokploy:
#   1. Create a new Docker Compose application
#   2. Paste this file or point to the repository
#   3. Configure environment variables in the Environment tab
#   4. Add domain in the Domains tab (select openclaw-gateway service, port 18789)
#   5. Deploy
#
# Volume Persistence:
#   - Uses Docker named volumes for Dokploy Volume Backups compatibility
#   - Alternatively, use ../files/ for bind mounts

# =============================================================================
# SHARED CONFIGURATION (YAML Anchors)
# =============================================================================

x-common-env: &common-env
  HOME: /home/node
  TERM: xterm-256color
  TZ: ${TZ:-UTC}
  NODE_ENV: ${NODE_ENV:-production}
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
  OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
  OPENCLAW_PROFILE: ${OPENCLAW_PROFILE:-default}

x-ai-providers: &ai-providers
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
  COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
  VENICE_API_KEY: ${VENICE_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  KIMICODE_API_KEY: ${KIMICODE_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  CHUTES_API_KEY: ${CHUTES_API_KEY:-}
  QWEN_PORTAL_API_KEY: ${QWEN_PORTAL_API_KEY:-}
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  Z_AI_API_KEY: ${Z_AI_API_KEY:-}
  SYNTHETIC_API_KEY: ${SYNTHETIC_API_KEY:-}

x-aws-bedrock: &aws-bedrock
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_PROFILE: ${AWS_PROFILE:-}

x-channel-tokens: &channel-tokens
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}

x-tools: &tools
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

# =============================================================================
# SERVICES
# =============================================================================

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: openclaw-gateway
    environment:
      <<: [*common-env, *ai-providers, *aws-bedrock, *channel-tokens, *tools]
      # Gateway requires token (not optional)
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      # Option 1: Docker named volumes (recommended for Dokploy Volume Backups)
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      # Option 2: Bind mounts using ../files (uncomment and comment above)
      # - ../files/config:/home/node/.openclaw
      # - ../files/workspace:/home/node/.openclaw/workspace
    # Expose port for Traefik (Dokploy will add labels automatically via Domains tab)
    expose:
      - "18789"
      - "18790"
    # Or use ports if you need direct host access (not recommended with Traefik)
    # ports:
    #   - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    #   - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    networks:
      - dokploy-network
    init: true
    restart: unless-stopped
    # Health check for Dokploy monitoring
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18789/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "all",
        "--port",
        "18789"
      ]
    # Manual Traefik labels (only if NOT using Dokploy Domains tab)
    # Uncomment and customize if you prefer manual configuration
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.openclaw-gateway.rule=Host(`openclaw.yourdomain.com`)
    #   - traefik.http.routers.openclaw-gateway.entrypoints=websecure
    #   - traefik.http.routers.openclaw-gateway.tls=true
    #   - traefik.http.routers.openclaw-gateway.tls.certresolver=letsencrypt
    #   - traefik.http.services.openclaw-gateway.loadbalancer.server.port=18789

# =============================================================================
# VOLUMES (Docker Named Volumes for Dokploy Volume Backups)
# =============================================================================

volumes:
  openclaw-config:
    name: openclaw-config
  openclaw-workspace:
    name: openclaw-workspace

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  dokploy-network:
    external: true
