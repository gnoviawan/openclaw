# OpenClaw Dokploy Deployment (Build from Source)
#
# This version builds the image on your server to ensure architecture compatibility.
# First deployment will take 5-10 minutes for compilation.
#
# Setup in Dokploy:
#   1. Create a new Docker Compose application
#   2. Set the compose type to "Build from Dockerfile" or paste this content
#   3. Configure environment variables in the Environment tab
#   4. Add domain in the Domains tab (select openclaw-gateway service, port 18789)
#   5. Deploy

# =============================================================================
# SHARED CONFIGURATION (YAML Anchors)
# =============================================================================

x-common-env: &common-env
  HOME: /home/node
  TERM: xterm-256color
  TZ: ${TZ:-UTC}
  NODE_ENV: ${NODE_ENV:-production}
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
  OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
  OPENCLAW_PROFILE: ${OPENCLAW_PROFILE:-default}

x-ai-providers: &ai-providers
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
  COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
  VENICE_API_KEY: ${VENICE_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  KIMICODE_API_KEY: ${KIMICODE_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  CHUTES_API_KEY: ${CHUTES_API_KEY:-}
  QWEN_PORTAL_API_KEY: ${QWEN_PORTAL_API_KEY:-}
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  Z_AI_API_KEY: ${Z_AI_API_KEY:-}
  SYNTHETIC_API_KEY: ${SYNTHETIC_API_KEY:-}

x-aws-bedrock: &aws-bedrock
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_PROFILE: ${AWS_PROFILE:-}

x-channel-tokens: &channel-tokens
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}

x-tools: &tools
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

# =============================================================================
# SERVICES
# =============================================================================

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw:local
    container_name: openclaw-gateway
    environment:
      <<: [*common-env, *ai-providers, *aws-bedrock, *channel-tokens, *tools]
      # Gateway requires token (not optional)
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      # Bind mounts using environment variables (set in Dokploy Environment tab)
      # Defaults to ./data/config and ./data/workspace relative to compose file
      - ${OPENCLAW_CONFIG_DIR:-./data/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace
    expose:
      - "18789"
      - "18790"
    networks:
      - dokploy-network
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"net\").connect({port:18789,host:\"localhost\"},()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "lan",
        "--port",
        "18789"
      ]

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  dokploy-network:
    external: true
